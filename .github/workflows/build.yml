name: Build XMAPort

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      device:
        description: '目标设备代号 (e.g. sheng, fuxi, cupid, mondrian)'
        required: true
        type: string
      source:
        description: '源 ROM 直链（留空用 config.ini）'
        required: false
        type: string
      target:
        description: '目标 ROM 直链（留空用 config.ini）'
        required: false
        type: string

# 同一分支的移植任务串行，避免两次 2 小时级的构建互相抢磁盘
concurrency:
  group: xmaport-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  porting:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 240
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Report disk space (before)
        shell: pwsh
        run: Get-PSDrive C | Select-Object @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}}

      # windows-latest 预装了一堆用不到的 SDK；两个完整 ROM + 解包后分区很容易超过 30GB
      - name: Free disk space
        shell: pwsh
        run: |
          $targets = @(
            'C:\Android',
            'C:\hostedtoolcache\windows\node',
            'C:\hostedtoolcache\windows\Ruby',
            'C:\hostedtoolcache\windows\PyPy',
            'C:\hostedtoolcache\windows\go',
            'C:\Program Files\Google\Chrome',
            'C:\Program Files\Microsoft SDKs',
            "$env:USERPROFILE\.gradle",
            "$env:USERPROFILE\.m2",
            "$env:USERPROFILE\.nuget",
            "$env:USERPROFILE\.rustup",
            "$env:USERPROFILE\.cargo"
          )
          foreach ($t in $targets) {
            if (Test-Path $t) {
              try { Remove-Item -Recurse -Force $t -ErrorAction Stop; Write-Host "removed $t" }
              catch { Write-Host "skip $t ($($_.Exception.Message))" }
            }
          }
          Get-PSDrive C | Select-Object @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Brotli
        shell: pwsh
        run: pip install Brotli

      # 先花 1 秒拦住最容易白跑 2 小时的情况：
      # pack_super=false 时不生成 super.img，最后一步必然 exit 1
      - name: Preflight check (config.ini)
        shell: pwsh
        run: python .github/scripts/preflight.py

      - name: Run XMAPort
        shell: pwsh
        run: |
          $args = @("--auto", "--device", "${{ inputs.device }}")
          if ("${{ inputs.source }}") { $args += "--source"; $args += "${{ inputs.source }}" }
          if ("${{ inputs.target }}") { $args += "--target"; $args += "${{ inputs.target }}" }
          python XMAPort.py @args

      # 只列不删：即便这次没装下 super，也能拿到"源分区里谁最占地方"的清单，
      # 下一轮就能按名字精准瘦身
      - name: Report source tree sizes
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path workspace | Out-Null
          python .github/scripts/report_sizes.py 2>&1 | Tee-Object -FilePath workspace/size-report.txt

      # 失败也要留下日志和 rom_info.txt，否则 2 小时后什么都看不到
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xmaport-logs-${{ inputs.device }}
          path: |
            workspace/*.log
            workspace/rom_info.txt
            workspace/size-report.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Compress and split super.img
        shell: pwsh
        run: |
          if (-not (Test-Path workspace\packed\super.img)) { Write-Error "super.img not found"; exit 1 }
          .\tools\7z.exe a -t7z -mx=5 -v1900m workspace\super-${{ inputs.device }}.7z workspace\packed\super.img
          if ($LASTEXITCODE -ne 0) { Write-Error "7z failed (exit $LASTEXITCODE)"; exit 1 }

      - name: Upload to Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $date = Get-Date -Format "MMdd"
          $n = 1
          $prefix = "XMAPort-Output-${{ inputs.device }}-$date"
          while (gh release view "$prefix-$n" 2>$null) { $n++ }
          $tag = "$prefix-$n"

          $volFiles = @(Get-ChildItem "workspace\super-${{ inputs.device }}.7z.*" | ForEach-Object { $_.FullName })
          if (-not $volFiles) { Write-Error "no split volumes found"; exit 1 }
          $logFiles = @(Get-ChildItem "workspace\*.log" -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName })
          $allFiles = $volFiles + $logFiles

          $romInfo = @("ROM Info:")
          if (Test-Path workspace\rom_info.txt) {
            $romInfo += Get-Content workspace\rom_info.txt -Encoding UTF8 | Where-Object { $_ -match '^\S+:\s*\S+' }
          } else {
            $romInfo += "device: ${{ inputs.device }}"
          }
          $notes = "移植输出（分卷 7z，每卷 <=2GB）。`n`n" + ($romInfo -join "`n") + "`n`n合并解压：`n7z x super-${{ inputs.device }}.7z.001"

          gh release create $tag $allFiles --title "XMAPort ${{ inputs.device }} $date #$n" --notes $notes --latest

  build:
    # 提交信息里带 [skip release] 就不发包，方便只改配置/工具链的提交
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip release]')
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Package release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release
          Copy-Item XMAPort.py release\
          Copy-Item -Recurse tools release\
          Copy-Item config.ini release\
          Compress-Archive -Path release\* -DestinationPath XMAPort-win64.zip

      - name: Upload to Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $date = Get-Date -Format "yyyyMMdd"
          $n = 1
          $tag = "XMAPort-${date}-Beta-$n"
          while (gh release view $tag 2>$null) { $n++; $tag = "XMAPort-${date}-Beta-$n" }
          gh release create $tag XMAPort-win64.zip --title "XMAPort ${date} Beta" --notes "自动构建的 Windows 版本（Python 源码包，需安装 Python 3）。`n`n用法：解压后运行 python XMAPort.py（或使用命令行参数 --auto/--device/--source/--target）。" --latest
